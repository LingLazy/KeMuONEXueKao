<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="科目一教考 · 1964道完整题库 · 24分类 · 76条口诀 · 公安部令第163号 · 2026年7月最新版">
<meta name="keywords" content="科目一,驾考,1964题,口诀,记分管理,公安部令第163号,2026">
<title>科目一教考 · 1964题完整题库 · 24分类速记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== 顶部毛玻璃导航 ==================== -->
<nav id="topnav">
  <div class="brand">
    <span class="brand-mark">科</span>
    <span class="brand-text">科目一<span class="brand-accent">·</span>教考</span>
  </div>
  <div class="nav-links">
    <a href="#practice" class="nav-link active" data-view="practice">题库练习</a>
    <a href="#mnemonics" class="nav-link" data-view="mnemonics">口诀总览</a>
    <a href="#categories" class="nav-link" data-view="categories">分类导航</a>
  </div>
  <div class="nav-meta">
    <span class="nav-stat"><span id="nav-progress">0</span> / 1964</span>
    <span class="nav-stat nav-stat-accuracy">正确率 <span id="nav-accuracy">—</span></span>
  </div>
</nav>

<!-- ==================== 主内容 ==================== -->
<main id="app">

  <!-- ========== 题库练习视图 ========== -->
  <section id="view-practice" class="view active">
    <!-- 分类侧栏 + 答题主区 -->
    <aside class="practice-sidebar" id="category-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-label">分类导航</div>
        <div class="sidebar-count" id="sidebar-total">24 个分类</div>
      </div>
      <div class="sidebar-search">
        <input type="text" id="search-input" placeholder="搜索题目关键词…" autocomplete="off">
      </div>
      <div class="sidebar-list" id="category-list"></div>
    </aside>

    <div class="practice-main">
      <!-- 答题头部 -->
      <header class="practice-header">
        <div class="header-left">
          <div class="practice-cat-tag" id="practice-cat-tag">全部题目</div>
          <h2 class="practice-title">
            <span id="practice-index">1</span>
            <span class="title-divider">/</span>
            <span id="practice-total">1964</span>
          </h2>
        </div>
        <div class="header-right">
          <button class="ghost-btn" id="btn-prev" title="上一题">←</button>
          <button class="ghost-btn" id="btn-next" title="下一题">→</button>
          <button class="ghost-btn" id="btn-shuffle" title="乱序">⇄</button>
          <button class="ghost-btn" id="btn-reset" title="重置进度">↺</button>
        </div>
      </header>

      <!-- 进度条 -->
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-glow"></div>
      </div>

      <!-- 题目卡片 -->
      <article class="question-card" id="question-card">
        <div class="q-meta">
          <span class="q-type" id="q-type">单选题</span>
          <span class="q-chapter" id="q-chapter">章节</span>
          <span class="q-tags" id="q-tags"></span>
        </div>
        <div class="q-body" id="q-body">
          <div class="q-image-wrap" id="q-image-wrap" style="display:none">
            <div class="q-image-placeholder">[ 图像题 ]</div>
          </div>
          <div class="q-text" id="q-text">题目加载中…</div>
        </div>
        <div class="q-options" id="q-options"></div>
        <div class="q-feedback" id="q-feedback" style="display:none"></div>
        <div class="q-analysis" id="q-analysis" style="display:none">
          <div class="analysis-label">解析</div>
          <div class="analysis-text" id="analysis-text"></div>
        </div>
        <div class="q-mnemonic-hint" id="q-mnemonic-hint" style="display:none">
          <div class="hint-label">口诀提示</div>
          <div class="hint-content" id="hint-content"></div>
        </div>
      </article>

      <!-- 题目快捷跳转 -->
      <div class="quick-jump">
        <div class="quick-jump-label">题目跳转</div>
        <div class="quick-jump-input">
          <input type="number" id="jump-input" min="1" max="1964" placeholder="题号">
          <button class="mini-btn" id="jump-btn">跳转</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== 口诀总览视图 ========== -->
  <section id="view-mnemonics" class="view">
    <div class="view-inner">
      <header class="view-header">
        <div class="section-label">MNEMONICS · 速记口诀</div>
        <h2 class="section-title">76 条<span class="accent">口诀总览</span></h2>
        <p class="section-lead">按 24 个分类整理的全部速记口诀，配合题目练习效果更佳。每条口诀均附详细解释与适用场景。</p>
      </header>
      <div class="mnemonics-filter-bar" id="mnemonics-filter">
        <button class="filter-chip active" data-cat="all">全部 <span class="chip-count">76</span></button>
      </div>
      <div class="mnemonics-grid" id="mnemonics-grid"></div>
    </div>
  </section>

  <!-- ========== 分类导航视图 ========== -->
  <section id="view-categories" class="view">
    <div class="view-inner">
      <header class="view-header">
        <div class="section-label">CATEGORIES · 24 分类导航</div>
        <h2 class="section-title">题库<span class="accent">分类总览</span></h2>
        <p class="section-lead">点击任意分类进入对应题目练习，每类均已标注题目数量与主题色。</p>
      </header>
      <div class="categories-grid" id="categories-grid"></div>
    </div>
  </section>

</main>

<!-- ==================== 答题反馈 Toast ==================== -->
<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
